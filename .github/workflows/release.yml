name: release

# Compiles the abstract CLI from the bundle in dist/ and publishes the binaries, their
# checksums and install.sh as a GitHub release. Abstract's publish script pushes the
# bundle and a v* tag to this repository; nothing here is edited by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  compile:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            targets: darwin-arm64 darwin-x64
          - runner: ubuntu-latest
            targets: linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: The tag is the version the bundle reports
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
          test "$(bun dist/abstract.js --version)" = "$(cat VERSION)"
      - name: Compile
        run: |
          mkdir out
          for target in ${{ matrix.targets }}; do
            bun build --compile --target="bun-$target" dist/abstract.js --outfile "out/abstract-$target"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.runner }}
          path: out/
          if-no-files-found: error

  publish:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: shellcheck install.sh
      - name: Checksums
        working-directory: out
        run: |
          sha256sum abstract-* > checksums.txt
          cat checksums.txt
          test "$(wc -l < checksums.txt)" -eq 6
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/abstract-* out/checksums.txt install.sh \
            --title "abstract ${GITHUB_REF_NAME#v}" \
            --notes "Compiled by this repository's release workflow from \`dist/abstract.js\`. \`checksums.txt\` lists the SHA-256 of every binary, and \`install.sh\` verifies it." \
            --latest

  # Installs the published release on a clean machine of each kind, the way a user does.
  verify:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: darwin-arm64
            runner: macos-latest
          - name: linux-x64-musl
            runner: ubuntu-latest
            container: alpine:3
    name: verify ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 10
    steps:
      - name: Tools the installer needs on Alpine
        if: matrix.container
        run: apk add --no-cache bash curl
      - name: Install with the published installer
        shell: sh
        run: |
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" |
            ABSTRACT_VERSION="${GITHUB_REF_NAME#v}" bash
      - name: The installed binary runs and reports the released version
        shell: sh
        run: |
          test "$("$HOME/.local/bin/abstract" --version)" = "${GITHUB_REF_NAME#v}"
          # A fresh machine is not signed in: the command must say so and exit 1.
          if "$HOME/.local/bin/abstract" token; then exit 1; fi
